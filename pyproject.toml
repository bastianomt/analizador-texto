[project]
name = "analizador-texto"
version = "0.1.0"
description = "mini proyecto para practicar python para buscar palabras mas repetidas de un fichero"
readme = "README.md"
authors = [{ name = "Sebastian" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
analizador-texto = "analizador_texto.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3"]
